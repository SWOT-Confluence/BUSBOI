# Main build pipeline that verifies, builds, and deploys the software
name: Create a BUSBOI release
# Events that trigger the workflow
on:
  # Run workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: BUSBOI version to create release for
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create BUSBOI GitHub release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          name: BUSBOI ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.version }}
